[project]
name = "ai"
version = "0.1.0"
description = "AI to read microphone and identify speech and sounds for Godot game"
readme = "README.md"
authors = [
    { name = "MJMrigg", email = "riggmatthew20@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "panns-inference>=0.1.1",
    "pynput>=1.8.2",
    "sounddevice>=0.5.6",
    "whisper-mic>=1.4.4",
    "numpy==2.5.4",
    "torch>=2.14.1",
    "librosa>=1.0.0",
    "scipy>=1.18.1",
]

[project.scripts]
ai = "ai:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
